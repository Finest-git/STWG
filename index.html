}
function backupFooter(){

}
function icsReminder(){
  var d=new Date(); d.setHours(16,0,0,0); while(d.getDay()!==5||d<=new Date()) d.setDate(d.getDate()+1);
  function f(x){ function p(n){ return (n<10?'0':'')+n; } return x.getFullYear()+p(x.getMonth()+1)+p(x.getDate())+'T'+p(x.getHours())+p(x.getMinutes())+'00'; }
  var e=new Date(d.getTime()+15*60000);
  var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//STWG//DE','BEGIN:VEVENT','UID:stwg-sicherung@local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+f(d),'DTEND:'+f(e),'RRULE:FREQ=WEEKLY;BYDAY=FR','SUMMARY:STWG-App: Sicherung machen','DESCRIPTION:App öffnen und auf Sichern tippen.','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Sicherung','TRIGGER:PT0S','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  var url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); var a=document.createElement('a'); a.href=url; a.download='stwg-sicherung-freitag.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); },4000);
  toast('Öffne die Datei, dann trägt dein Kalender die Erinnerung jeden Freitag um 16:00 ein.');
}

function secLevel(k,list){
  var open=list.filter(isOpen), lv=0;
  function up(x){ if(x>lv) lv=x; }
  if(k==='task'){ open.forEach(function(e){ var n=e.due?dayDiff(e.due):null; up(n!==null&&n<0?3:((n!==null&&n<=7)||e.prio==='Hoch'?2:1)); }); }
  else if(k==='damage'){ open.forEach(function(e){ up(e.sev==='Hoch'?3:(e.sev==='Gering'?1:2)); }); }
  else if(k==='appointment'){ open.forEach(function(e){ var n=e.date?dayDiff(e.date):null; if(n!==null&&n>=0) up(n<=2?2:(n<=7?1:0)); }); }
  else if(k==='asset'){ list.forEach(function(e){ if(!e.next) return; var n=dayDiff(e.next); up(n<0?3:(n<=14?2:0)); }); }
  else if(k==='contract'){ list.forEach(function(e){ if(!e.end) return; var n=dayDiff(e.end); if(n>=0) up(n<=30?3:(n<=90?2:0)); }); }
  else if(k==='key'){ list.forEach(function(e){ if(e.status==='Verloren') up(3); }); }
  return lv;
}
function secInfo(k,list){
  var n=list.length, open=list.filter(isOpen);
  if(k==='task'){ var late=open.filter(function(e){ return e.due&&dayDiff(e.due)<0; }).length; return [open.length, late?late+' überfällig':(open.length?'offen':'nichts offen'), late>0]; }
  if(k==='damage') return [open.length, open.length?'offen':'keine offenen', false];
  if(k==='appointment'){ var nx=open.map(function(e){ return e.date; }).filter(function(d){ return d&&dayDiff(d)>=0; }).sort()[0]; return [open.filter(function(e){ return e.date&&dayDiff(e.date)>=0; }).length, nx?'nächster '+fmtDate(nx).slice(0,6):'keine geplant', false]; }
  if(k==='log') return [hrs(list.filter(function(e){ return String(e.date||'').indexOf(ymd().slice(0,7))===0; }).reduce(function(s,e){ return s+(Number(e.hours)||0); },0)), 'Std. diesen Monat', false];
  if(k==='asset'){ var ds=list.map(function(e){ return e.next; }).filter(Boolean).sort()[0]; var lt=ds&&dayDiff(ds)<0; return [n, ds?(lt?'Wartung überfällig':'Wartung '+fmtDate(ds).slice(0,6)):'erfasst', !!lt]; }
  if(k==='contract'){ var soon=list.filter(function(e){ return e.end&&dayDiff(e.end)>=0&&dayDiff(e.end)<=90; }).length; return [n, soon?(soon===1?'1 läuft bald aus':soon+' laufen bald aus'):'erfasst', false]; }
  if(k==='key'){ var out=list.filter(function(e){ return e.status==='Ausgegeben'; }).length, lost=list.filter(function(e){ return e.status==='Verloren'; }).length; return [n, lost?lost+' verloren':out+' ausgegeben', lost>0]; }
  if(k==='meter') return [n, n===1?'Ablesung':'Ablesungen', false];
  return [n, 'erfasst', false];
}

function shrink(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*s); h=Math.round(h*s);
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/jpeg',q);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src=url;
  });
}

      if(!M) return;

/* ---------- Foto-Editor ---------- */
var A={shapes:[],cur:null,tool:'pen',color:'#e5322d',size:1,img:null,idx:0,cv:null,ctx:null};
var COLORS=['#e5322d','#ffd400','#2f7de1','#ffffff','#111111'];
var TOOLS=[['pen','Stift'],['arrow','Pfeil'],['circle','Kreis'],['rect','Rechteck'],['text','Text']];
function lw(){ return [0.003,0.006,0.011][A.size]*Math.max(A.cv.width,A.cv.height); }
function fs(){ return [0.03,0.045,0.065][A.size]*Math.max(A.cv.width,A.cv.height); }
function openAnnot(i){
  var p=M.photos[i]; if(!p) return;
  var img=new Image();
  img.onload=function(){
    A.img=img; A.shapes=[]; A.cur=null; A.idx=i;
    var m=$('#annot');
    m.innerHTML='<div class="bar"><button class="btn" data-act="a-cancel">Abbrechen</button><div class="actions"><button class="btn" data-act="a-undo">Rückgängig</button><button class="btn primary" data-act="a-done">Fertig</button></div></div>'+
      '<div id="astage"><canvas id="acv"></canvas></div><div class="tools" id="atools"></div>';
    m.hidden=false;
    A.cv=$('#acv'); A.cv.width=img.naturalWidth; A.cv.height=img.naturalHeight; A.ctx=A.cv.getContext('2d');
    fitCanvas(); renderTools(); redraw(); bindCanvas();
  };
  img.onerror=function(){ toast('Das Foto konnte nicht geladen werden.'); };
  img.src=photoSrc(p.e||p.o);
}
function fitCanvas(){
  var st=$('#astage'); if(!st||!A.cv) return;
  var r=st.getBoundingClientRect(), s=Math.min((r.width-8)/A.cv.width,(r.height-8)/A.cv.height);
  A.cv.style.width=Math.max(50,Math.floor(A.cv.width*s))+'px'; A.cv.style.height=Math.max(50,Math.floor(A.cv.height*s))+'px';
}
function renderTools(){
  $('#atools').innerHTML=TOOLS.map(function(t){ return '<button class="btn small'+(A.tool===t[0]?' on':'')+'" data-act="a-tool" data-v="'+t[0]+'">'+t[1]+'</button>'; }).join('')+
    '<span class="sep"></span>'+COLORS.map(function(c){ return '<button class="sw'+(A.color===c?' on':'')+'" style="background:'+c+'" aria-label="Farbe" data-act="a-color" data-v="'+c+'"></button>'; }).join('')+
    '<span class="sep"></span>'+['dünn','mittel','dick'].map(function(n,i){ return '<button class="btn small'+(A.size===i?' on':'')+'" data-act="a-size" data-v="'+i+'">'+n+'</button>'; }).join('');
}
function drawShape(c,s){
  c.lineCap='round'; c.lineJoin='round'; c.strokeStyle=s.c; c.fillStyle=s.c; c.lineWidth=s.w;
  if(s.t==='pen'){
    c.beginPath(); s.p.forEach(function(q,i){ i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]); });
    if(s.p.length===1) c.lineTo(s.p[0][0]+0.1,s.p[0][1]); c.stroke();
  }else if(s.t==='arrow'){
    var x1=s.a[0],y1=s.a[1],x2=s.a[2],y2=s.a[3]; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
    var an=Math.atan2(y2-y1,x2-x1), hl=s.w*4+14;
    c.beginPath(); c.moveTo(x2,y2); c.lineTo(x2-hl*Math.cos(an-0.45),y2-hl*Math.sin(an-0.45)); c.lineTo(x2-hl*Math.cos(an+0.45),y2-hl*Math.sin(an+0.45)); c.closePath(); c.fill();
  }else if(s.t==='circle'){
    c.beginPath(); c.ellipse((s.a[0]+s.a[2])/2,(s.a[1]+s.a[3])/2,Math.abs(s.a[2]-s.a[0])/2,Math.abs(s.a[3]-s.a[1])/2,0,0,Math.PI*2); c.stroke();
  }else if(s.t==='rect'){
    c.strokeRect(Math.min(s.a[0],s.a[2]),Math.min(s.a[1],s.a[3]),Math.abs(s.a[2]-s.a[0]),Math.abs(s.a[3]-s.a[1]));
  }else if(s.t==='text'){
    c.font='700 '+s.fs+'px system-ui, sans-serif'; c.textBaseline='middle';
    c.lineWidth=s.fs/7; c.strokeStyle=(s.c==='#ffffff'||s.c==='#ffd400')?'#111':'#fff'; c.strokeText(s.txt,s.x,s.y); c.fillText(s.txt,s.x,s.y);
  }
}
function redraw(){
  if(!A.ctx) return;
  A.ctx.drawImage(A.img,0,0,A.cv.width,A.cv.height);
  A.shapes.forEach(function(s){ drawShape(A.ctx,s); });
  if(A.cur) drawShape(A.ctx,A.cur);
}
function bindCanvas(){
  var cv=A.cv;
  var pt=function(ev){ var r=cv.getBoundingClientRect(); return [(ev.clientX-r.left)*cv.width/r.width,(ev.clientY-r.top)*cv.height/r.height]; };
  cv.addEventListener('pointerdown',function(ev){
    if(A.tool==='text') return; ev.preventDefault(); cv.setPointerCapture(ev.pointerId);
    var p=pt(ev), w=lw();
    A.cur = A.tool==='pen' ? {t:'pen',c:A.color,w:w,p:[p]} : {t:A.tool,c:A.color,w:w,a:[p[0],p[1],p[0],p[1]]};
    redraw();
  });
  cv.addEventListener('pointermove',function(ev){
    if(!A.cur) return; var p=pt(ev);
    if(A.cur.t==='pen') A.cur.p.push(p); else { A.cur.a[2]=p[0]; A.cur.a[3]=p[1]; }
    redraw();
  });
  var end=function(){
    if(!A.cur) return; var s=A.cur; A.cur=null;
    var tiny = s.t!=='pen' && Math.abs(s.a[2]-s.a[0])+Math.abs(s.a[3]-s.a[1])<8;
    if(!tiny) A.shapes.push(s); redraw();
  };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  cv.addEventListener('click',function(ev){
    if(A.tool!=='text') return;
    var p=pt(ev), st=$('#astage'), r=st.getBoundingClientRect();
    var old=st.querySelector('.txt'); if(old) old.blur();
    var inp=document.createElement('input'); inp.className='txt'; inp.placeholder='Text eingeben …'; inp.style.left=(ev.clientX-r.left)+'px'; inp.style.top=(ev.clientY-r.top)+'px'; inp.style.color=A.color;
    st.appendChild(inp); inp.focus();
    var done=false;
    var commit=function(){ if(done) return; done=true; var v=inp.value.trim(); inp.remove(); if(v){ A.shapes.push({t:'text',c:A.color,txt:v,x:p[0],y:p[1],fs:fs()}); redraw(); } };
    inp.addEventListener('keydown',function(e){ e.stopPropagation(); if(e.key==='Enter'){ e.preventDefault(); commit(); } if(e.key==='Escape'){ done=true; inp.remove(); } });
    inp.addEventListener('blur',commit);
  });
}
async function finishAnnot(){
  var btn=$('[data-act="a-done"]'); if(btn){ btn.disabled=true; btn.textContent='Speichert …'; }
  try{
    var live=$('#astage .txt'); if(live) live.blur();
    redraw();
    var blob=await new Promise(function(r){ A.cv.toBlob(r,'image/jpeg',0.88); });
    var id=await putPhoto(blob), p=M.photos[A.idx];
    if(p.e){ if(M.created.indexOf(p.e)>=0){ dropPhoto(p.e); M.created=M.created.filter(function(x){return x!==p.e;}); } else M.removed.push(p.e); }
    p.e=id; M.created.push(id);
    $('#annot').hidden=true; $('#annot').innerHTML=''; A.img=null; A.ctx=null; A.cv=null;
    renderPhotos(); openPhoto(A.idx);
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Fertig'; } toast('Das bearbeitete Foto konnte nicht gespeichert werden.'); }
}

  else if(a==='tpl-open') openTemplates();
  else if(a==='tpl-add') addTemplates();
  else if(a==='map-pin'){ if(!S.placing && unitById(id)){ S.mapSel=null; S.nav='units'; S.unitId=id; S.sec=null; S.house=''; S.showDone=false; render(); window.scrollTo(0,0); } }
  else if(a==='map-place-from'){ S.placing=id; S.mapSel=null; S.nav='today'; S.unitId=null; S.sec=null; render(); var se3=$('#sat'); if(se3) se3.scrollIntoView({block:'center'}); }
  else if(a==='map-place'){ S.placing=id; S.mapSel=id; mapRefresh(); var se=$('#sat'); if(se) se.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  else if(a==='map-cancel'){ S.placing=null; mapRefresh(); }
  else if(a==='sat-zin') satZoomBtn(1.6);
  else if(a==='sat-zout') satZoomBtn(1/1.6);
  else if(a==='sat-fit'){ if(SATV.nw){ S.mv={cx:.5,cy:.5,z:1}; satSchedule(); } }
  else if(a==='map-img'){ var mf=$('#mapfile'); if(mf) mf.click(); }
  else if(a==='h-add'){ var hl=$('#hlist'); hl.insertAdjacentHTML('beforeend',houseRow({id:newId(),name:''})); var ins=hl.querySelectorAll('.hin'); ins[ins.length-1].focus(); }
  else if(a==='h-del'){ el.closest('.hrow').remove(); }
  else if(a==='copy') copyText(el.getAttribute('data-v'));
  else if(a==='show-done'){ S.showDone=el.checked; render(); }
  else if(a==='cal-prev'){ S.cal.m--; if(S.cal.m<0){ S.cal.m=11; S.cal.y--; } render(); }
  else if(a==='cal-next'){ S.cal.m++; if(S.cal.m>11){ S.cal.m=0; S.cal.y++; } render(); }
  else if(a==='cal-today'){ calGoto(ymd()); render(); }
  else if(a==='cal-day'){ var dd=el.getAttribute('data-d'); S.cal.sel=dd; var pp=dd.split('-').map(Number); S.cal.y=pp[0]; S.cal.m=pp[1]-1; render(); }
  else if(a==='cal-add') openEntryForm(null,'appointment',{date:S.cal.sel,unit:S.cal.unit});
  else if(a==='m-close') closeForm(true);
  else if(a==='m-save') saveForm();
  else if(a==='m-del'){
    if(!el.classList.contains('armed')){ el.classList.add('armed'); el.textContent='Wirklich löschen? Nicht rückgängig'; return; }
    el.disabled=true;
    Promise.resolve(M.cfg.onDelete()).then(function(){ M.created.forEach(dropPhoto); closeForm(false); }).catch(function(){ el.disabled=false; toast('Löschen fehlgeschlagen.'); });
  }
  else if(a==='cam') $('#cam').click();
  else if(a==='gal') $('#gal').click();
  else if(a==='photo-open') openPhoto(i);
  else if(a==='photo-toggle') openPhoto(i, !!el.getAttribute('data-orig'));
  else if(a==='photo-edit'){ $('#lightbox').hidden=true; openAnnot(i); }
  else if(a==='photo-del'){
    if(!el.classList.contains('armed')){ el.classList.add('armed'); el.textContent='Wirklich entfernen?'; return; }
    removePhoto(i); closeLayer('#lightbox');
  }
  else if(a==='lb-close') closeLayer('#lightbox');
  else if(a==='a-cancel'){ closeLayer('#annot'); A.img=null; A.ctx=null; A.cv=null; }
  else if(a==='a-undo'){ A.shapes.pop(); redraw(); }
  else if(a==='a-done') finishAnnot();
  else if(a==='a-tool'){ A.tool=el.getAttribute('data-v'); A.cv.style.cursor=A.tool==='text'?'text':'crosshair'; renderTools(); }
  else if(a==='a-color'){ A.color=el.getAttribute('data-v'); renderTools(); }
  else if(a==='a-size'){ A.size=Number(el.getAttribute('data-v')); renderTools(); }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t && t.id==='q'){ S.q=t.value; var r=$('#qres'); if(r) r.innerHTML=searchResults(); }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t && (t.id==='cam'||t.id==='gal') && t.files && t.files.length){ addPhotos(Array.prototype.slice.call(t.files)); t.value=''; }
  if(t && t.id==='calUnit'){ S.cal.unit=t.value; render(); }
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape') return;
  if(!$('#annot').hidden){ if(!$('#astage .txt')){ $('#annot').hidden=true; $('#annot').innerHTML=''; } }
  else if(!$('#lightbox').hidden){ $('#lightbox').hidden=true; $('#lightbox').innerHTML=''; }
  else if(!$('#modal').hidden) closeForm(true);
});
window.addEventListener('resize',function(){ if(!$('#annot').hidden) fitCanvas(); });

/* ---------- Start ---------- */
async function init(){
  render();
  try{
    IDB=await idbOpen(); await loadAll();
    S.units=local.units.slice(); S.entries=local.entries.slice(); S.settings=local.settings.slice(); S.mode='local';
    if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){});
  }catch(e){ S.err='Speicher des Browsers nicht verfügbar (privater Modus?)'; }
  S.ready=true; wxLoad(); render(); wxFetch();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) wxFetch(); });
}
if('serviceWorker' in navigator) window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
init();
})();
</script>
